name: Release

# Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to run
# the checks, build installers for Windows, macOS and Linux, sign the updater
# artifacts, and publish a GitHub Release with the `latest.json` manifest the
# in-app updater polls. The tag must match the version in package.json,
# Cargo.toml, and tauri.conf.json.
#
# macOS builds are NOT Apple-signed or notarized: Gatekeeper warns on first
# open until a Developer ID is set up. See plans/release-pipeline.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            # One bundle for Apple Silicon and Intel.
            args: "--target universal-apple-darwin"
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $versions = [ordered]@{
            'package.json'              = (Get-Content package.json -Raw | ConvertFrom-Json).version
            'src-tauri/tauri.conf.json' = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            'src-tauri/Cargo.toml'      = ((Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value)
          }
          $bad = $versions.GetEnumerator() | Where-Object { $_.Value -ne $tag }
          foreach ($v in $versions.GetEnumerator()) { "{0}: {1}" -f $v.Key, $v.Value }
          if ($bad) { throw "Tag v$tag does not match: $(($bad | ForEach-Object { $_.Key }) -join ', ')" }

      # Tauri's Linux dependencies (webkit2gtk and friends).
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev build-essential curl wget file libssl-dev

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}

      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: "Skills Editor v__VERSION__"
          releaseBody: "Download the installer for your platform below. Installed copies update themselves from here."
          updaterJsonPreferNsis: true
