name: Release

# Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to run
# the checks, build the Windows installers, sign the updater artifacts, and
# publish a GitHub Release with the `latest.json` manifest the in-app updater
# polls. The tag must match the version in package.json, Cargo.toml, and
# tauri.conf.json.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $versions = [ordered]@{
            'package.json'              = (Get-Content package.json -Raw | ConvertFrom-Json).version
            'src-tauri/tauri.conf.json' = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            'src-tauri/Cargo.toml'      = ((Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value)
          }
          $bad = $versions.GetEnumerator() | Where-Object { $_.Value -ne $tag }
          foreach ($v in $versions.GetEnumerator()) { "{0}: {1}" -f $v.Key, $v.Value }
          if ($bad) { throw "Tag v$tag does not match: $(($bad | ForEach-Object { $_.Key }) -join ', ')" }

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ github.ref_name }}
          releaseName: "Skills Editor v__VERSION__"
          releaseBody: "Download and run the `-setup.exe` installer below. Installed copies update themselves from here."
          updaterJsonPreferNsis: true
