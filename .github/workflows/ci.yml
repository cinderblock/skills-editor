name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test
      # tsc + vite build
      - run: bun run build

  rust:
    # Every platform we publish for, so portability doesn't rot.
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    # A hosted runner that dies silently otherwise burns 48 minutes first.
    timeout-minutes: 40
    env:
      # Tests don't need debug info, and linking ~440 crates with it was
      # enough to starve the Linux runner until it dropped off the network.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # Four parallel rustc processes peak higher than a 16 GB runner likes.
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev build-essential curl wget file libssl-dev

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.platform }}
      # tauri::generate_context! embeds the frontend at compile time, so the
      # dist directory must exist even for `cargo test`.
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Split so a failure says whether it was the build or the tests.
      - name: Compile tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-run
      # One at a time with output, so a hang names the test that hung; the
      # step timeout keeps the runner alive to upload the log.
      - name: Run tests
        timeout-minutes: 10
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1 --nocapture
